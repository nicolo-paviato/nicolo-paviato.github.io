{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- Custom Styling -->
<style>
  /* Hide duplicate name under sidebar picture */
  .author__name {
    display: none !important;
  }

  /* Responsive circular profile picture (face + camel framing) */
  .author__avatar img {
    width: 100% !important;
    max-width: 220px !important;
    aspect-ratio: 1 / 1 !important;
    height: auto !important;
    object-fit: cover !important;
    object-position: 70% center !important;
    border-radius: 50% !important;
  }

  /* Prevent horizontal side-scrolling across screens */
  body, #main {
    overflow-x: hidden;
  }

  /* Compact & Proportional Footer Strip */
  .page__footer {
    width: 100% !important;
    padding: clamp(0.4em, 1.2vh, 0.8em) 1em !important; /* Dynamically scales padding with viewport height */
    margin-top: clamp(1em, 2.5vh, 2em) !important;
    text-align: center !important;
    box-sizing: border-box !important;
  }

  .page__footer footer {
    padding: 0 !important;
  }

  .page__footer-copyright {
    font-size: clamp(0.68rem, 0.85vw, 0.78rem) !important; /* Proportional text size based on screen width */
    line-height: 1.3 !important;
    word-wrap: break-word !important;
    max-width: 90% !important;
    margin: 0 auto !important;
  }

  /* Scale down publication archive headers and paper titles */
  .archive__item-title {
    font-size: 1.1rem !important;
    margin-top: 0.5em !important;
    margin-bottom: 0.2em !important;
  }

  .archive__item-excerpt, 
  .archive__item {
    font-size: 0.95rem !important;
    line-height: 1.5 !important;
  }

  .archive h2, 
  .taxonomy__section h2 {
    font-size: 1.3rem !important;
    border-bottom: 1px solid #e0e0e0;
    padding-bottom: 0.3em;
  }

  /* Mobile optimizations for small screens */
  @media (max-width: 768px) {
    .author__avatar img {
      max-width: 200px !important;
    }

    .page__footer {
      padding: 0.4em 0.6em !important;
    }

    .page__footer-copyright {
      font-size: 0.7rem !important;
    }
  }
</style>

<!-- Custom Browser Tab Title on Homepage -->
{% if page.url == "/" %}
<script>
  document.title = "Nicolò Paviato";
</script>
{% endif %}

<!-- end custom head snippets -->
